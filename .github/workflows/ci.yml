# Tests on every pull request and push to main. Each job runs the stand-in
# WHMCS and MariaDB in Docker on the runner's own network
# (docker/compose.yaml), so it is Linux only.
#
# - test: PHP 8.1, 8.2 and 8.3 (required: the PHP versions WHMCS 8.13 and
#   9.x support) and 8.4 (allowed to fail: WHMCS doesn't support it yet):
#   the zip unzipped into the stand-in WHMCS, then the unit, module and http
#   suites. Webhooks are tested against Monokulo's published vectors
#   (tests/vectors, pinned in tests/vectors/PIN). 8.3 also reports coverage.
# - vectors: the vendored vectors are still the ones at the pinned commit.
# - smoke: against a real Monokulo built from the pinned commit (or a given
#   image), on its own address and under a path, with the OpenAPI document
#   written at that commit: on main, nightly and by hand, not on pull
#   requests (building Monokulo takes a while).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      monokulo_image:
        description: Monokulo image for the smoke test (empty builds the commit in tests/vectors/PIN)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            experimental: false
          - php: '8.2'
            experimental: false
          - php: '8.3'
            experimental: false
            coverage: true
          - php: '8.4'
            experimental: true
    env:
      PHP_VERSION: ${{ matrix.php }}
      COVERAGE: ${{ matrix.coverage && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the stand-in WHMCS
        run: scripts/test up
      - name: Run the tests
        run: scripts/test all
      - name: Coverage summary
        if: matrix.coverage
        run: |
          {
            echo '### Coverage (unit, module)'
            echo '```'
            sed -n '1,8p' coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.coverage
        with:
          name: coverage
          path: coverage/html
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: monokulo-whmcs.zip
          path: |
            dist/monokulo-whmcs.zip
            dist/monokulo-whmcs.zip.sha256
      - name: The stand-in WHMCS's log
        if: failure()
        timeout-minutes: 3
        run: timeout 60 docker compose -f docker/compose.yaml logs --no-color --tail 200 whmcs || true

  vectors:
    name: Webhook vectors match the pinned Monokulo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the pinned commit
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
        run: scripts/vectors check

  smoke:
    name: Smoke test against Monokulo
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build Monokulo at the pinned commit
        if: inputs.monokulo_image == ''
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
        run: |
          . tests/vectors/PIN
          auth=${MONOKULO_READ_TOKEN:+x-access-token:$MONOKULO_READ_TOKEN@}
          docker build -t monokulo:smoke "https://${auth}${repository#https://}.git#${commit}"
      - name: Write Monokulo's OpenAPI document at the pinned commit, with its examples
        env:
          MONOKULO_READ_TOKEN: ${{ secrets.MONOKULO_READ_TOKEN }}
        run: |
          . tests/vectors/PIN
          auth=${MONOKULO_READ_TOKEN:+x-access-token:$MONOKULO_READ_TOKEN@}
          git init -q "$RUNNER_TEMP/monokulo"
          cd "$RUNNER_TEMP/monokulo"
          git fetch -q --depth 1 "https://${auth}${repository#https://}.git" "$commit"
          git checkout -q FETCH_HEAD
          cargo xtask api openapi --out "$RUNNER_TEMP/openapi.json"
      - name: Start the stand-in WHMCS and install the gateway
        run: scripts/test up
      - name: Smoke test
        env:
          MONOKULO_IMAGE: ${{ inputs.monokulo_image || 'monokulo:smoke' }}
          MONOKULO_OPENAPI: ${{ runner.temp }}/openapi.json
        run: scripts/smoke
      - name: The stand-in WHMCS's log
        if: failure()
        timeout-minutes: 3
        run: timeout 60 docker compose -f docker/compose.yaml logs --no-color --tail 200 whmcs || true
